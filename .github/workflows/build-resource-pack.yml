name: Build Axon resource packs

on:
  pull_request:
    paths:
      - "zrodla/**"
      - "QualityArmory-21-axon*.zip"
      - ".github/workflows/build-resource-pack.yml"
  push:
    branches: [main]
    paths:
      - "zrodla/**"
      - "QualityArmory-21-axon*.zip"
      - ".github/workflows/build-resource-pack.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install --upgrade pillow numpy
      - name: Rebuild shader variants and validate packs
        run: |
          python zrodla/dodaj_shadery.py
          python zrodla/sprawdz_paczke.py QualityArmory-21-axon.zip QualityArmory-21-axon-1.21.11.zip QualityArmory-21-axon-1.21.11-shadery.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AxonGunsResourcePack
          path: |
            QualityArmory-21-axon.zip
            QualityArmory-21-axon-1.21.11.zip
            QualityArmory-21-axon-1.21.11-shadery.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: AxonGunsResourcePack
          path: .
      - name: Publish generated packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QualityArmory-21-axon.zip QualityArmory-21-axon-1.21.11.zip QualityArmory-21-axon-1.21.11-shadery.zip
          if git diff --cached --quiet; then
            echo "Resource packs are already current."
            exit 0
          fi
          git commit -m "build: refresh generated resource pack archives"
          git push origin main
